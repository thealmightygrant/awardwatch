name: Refresh award data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-awards.yml"
      - "scripts/**"

concurrency:
  group: award-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search NYC multi-program availability
        run: python scripts/nyc_multi_watch.py

      - name: Search New Year couple availability
        run: python scripts/newyear_couple.py

      - name: Validate JSON
        run: |
          python -m json.tool data/solo-hiking.json >/dev/null
          python -m json.tool data/couple-europe.json >/dev/null
          python -m json.tool data/newyear-couple.json >/dev/null

      - name: Publish updated data
        run: |
          cp data/solo-hiking.json /tmp/solo-hiking.json
          cp data/couple-europe.json /tmp/couple-europe.json
          cp data/newyear-couple.json /tmp/newyear-couple.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/solo-hiking.json data/solo-hiking.json
          cp /tmp/couple-europe.json data/couple-europe.json
          cp /tmp/newyear-couple.json data/newyear-couple.json
          git config user.name "award-watch"
          git config user.email "award-watch@users.noreply.github.com"
          git add data/solo-hiking.json data/couple-europe.json data/newyear-couple.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh award data"
          git push origin HEAD:main
