name: Refresh award data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-awards.yml"
      - "scripts/**"

concurrency:
  group: award-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search Aeroplan New Year availability
        run: python scripts/aeroplan_nye.py

      - name: Search Flying Blue Europe availability
        run: python scripts/flyingblue_europe.py

      - name: Search 2027 anniversary availability
        run: python scripts/anniversary_2027.py

      - name: Validate JSON
        run: |
          python -m json.tool data/aeroplan-nye.json >/dev/null
          python -m json.tool data/flyingblue-europe.json >/dev/null
          python -m json.tool data/anniversary-2027.json >/dev/null

      - name: Publish updated data
        run: |
          cp data/aeroplan-nye.json /tmp/aeroplan-nye.json
          cp data/flyingblue-europe.json /tmp/flyingblue-europe.json
          cp data/anniversary-2027.json /tmp/anniversary-2027.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/aeroplan-nye.json data/aeroplan-nye.json
          cp /tmp/flyingblue-europe.json data/flyingblue-europe.json
          cp /tmp/anniversary-2027.json data/anniversary-2027.json
          git config user.name "award-watch"
          git config user.email "award-watch@users.noreply.github.com"
          git add data/aeroplan-nye.json data/flyingblue-europe.json data/anniversary-2027.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh award data"
          git push origin HEAD:main
