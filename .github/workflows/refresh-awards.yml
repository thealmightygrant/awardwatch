name: Refresh award data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-awards.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search Aeroplan New Year availability
        run: python scripts/aeroplan_nye.py

      - name: Validate JSON
        run: python -m json.tool data/aeroplan-nye.json >/dev/null

      - name: Commit updated data
        run: |
          git config user.name "award-watch"
          git config user.email "award-watch@users.noreply.github.com"
          git add data/aeroplan-nye.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh Aeroplan award data"
          git pull --rebase origin main
          git push origin HEAD:main
