name: Refresh award data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-awards.yml"
      - "scripts/**"

concurrency:
  group: award-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search NYC Europe and solo hiking availability
        id: nyc
        continue-on-error: true
        run: python scripts/nyc_multi_watch.py

      - name: Search New Year couple availability
        id: nye
        continue-on-error: true
        run: python scripts/newyear_couple.py

      - name: Search 2027 anniversary availability
        id: anniversary
        continue-on-error: true
        run: python scripts/anniversary_2027.py

      - name: Validate generated JSON
        run: |
          for f in data/couple-europe.json data/solo-hiking.json data/newyear-couple.json data/anniversary-2027.json; do
            if [ -f "$f" ]; then
              python -m json.tool "$f" >/dev/null
            fi
          done

      - name: Publish any successful updates
        run: |
          mkdir -p /tmp/award-data
          for f in couple-europe.json solo-hiking.json newyear-couple.json anniversary-2027.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "/tmp/award-data/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          for f in couple-europe.json solo-hiking.json newyear-couple.json anniversary-2027.json; do
            if [ -f "/tmp/award-data/$f" ]; then cp "/tmp/award-data/$f" "data/$f"; fi
          done
          git config user.name "award-watch"
          git config user.email "award-watch@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh award data"
          git push origin HEAD:main

      - name: Report partial failures
        if: always()
        run: |
          echo "nyc=${{ steps.nyc.outcome }}"
          echo "nye=${{ steps.nye.outcome }}"
          echo "anniversary=${{ steps.anniversary.outcome }}"
